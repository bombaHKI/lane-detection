		async function loadGeoPackage(url,rgbString) {
			{ // load a geopackage
				const geopackage = await Potree.GeoPackageLoader.loadUrl(url, {color: "red"});
				updateGeoPackageHeight(geopackage);
				viewer.scene.addGeopackage(geopackage);
				for (const child of geopackage.node.children[0].children) {
					child.material.color.setStyle(rgbString);
				}
			}
		}

		async function updateGeoPackageHeight(geopackage) {
			const pointcloud = viewer.scene.pointclouds[0];
			const boundingBox = pointcloud.boundingBox;
			const groundHeight = (boundingBox.max.z+boundingBox.min.z)/2-15;

			for (const child of geopackage.node.children[0].children) {
				var g = child.geometry;
				var a1 = g.attributes.instanceStart.array;
				var a2 = g.attributes.instanceEnd.array;
				for (let i = 2; i < a1.length; i+=3) {
					if (a1[i]==0)
					a1[i] = groundHeight;
				}
				
				for (let i = 2; i < a2.length; i+=3) {
					if (a2[i]==0)
					a2[i] = groundHeight;
				}

				// Tell THREE.js to update the GPU buffer
				g.attributes.instanceEnd.needsUpdate = true;
				g.attributes.instanceStart.needsUpdate = true;
			}
		}

		async function loadCarTrajectory(url, colorString, heightOffset=0) {
			try {
				// Load the car trajectory GeoJSON file with cache-busting
				const response = await fetch(url);
				const geojson = await response.json();
				
				console.log("Car trajectory loaded:", geojson);

				// Car trajectory is already in EPSG:3857, no transformation needed
				geojson.features.forEach(feature => {
					if (feature.geometry.type === "LineString" && feature.geometry.coordinates.length > 0) {
						const points = feature.geometry.coordinates.map(coord => 
							new THREE.Vector3(coord[0], coord[1], coord[2]+heightOffset)  // Slightly above ground
						);
						
						const geometry = new THREE.BufferGeometry().setFromPoints(points);
						const material = new THREE.LineBasicMaterial({ 
							color: colorString,  // Cyan color for car trajectory
							linewidth: 150
						});
						const line = new THREE.Line(geometry, material);
						line.name = feature.properties?.name || 'Car Trajectory';
						viewer.scene.scene.add(line);
					}
				});

				console.log("Car trajectory added successfully");
			} catch (error) {
				console.error("Failed to load car trajectory:", error);
			}
		}
